name: Build and release

# Raise APP_VERSION in PDFMule.pyw, write RELEASE_NOTES.md and push to main: if release v<VERSION>
# does not exist yet, GitHub tests the .pyw, builds the Windows .exe, the macOS apps (Apple silicon
# and Intel) and the Linux binary, and publishes them with the .pyw in a new release (it creates the
# tag itself). Every running PDF Mule then finds the update by itself.
#
# Any other branch: the same tests and builds run, nothing is released (the files are kept as
# workflow artifacts to try out). Running the workflow by hand on main, or a push whose commit
# message contains [rebuild], rebuilds the current version and replaces its files.
#
# Signing (optional, repository secrets in Settings › Secrets and variables › Actions):
#   WINDOWS_CERT_PFX / WINDOWS_CERT_PASSWORD      code-signing certificate (.pfx as base64) + password
#   MACOS_CERT_P12 / MACOS_CERT_PASSWORD           Developer ID Application certificate (.p12 as base64)
#   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD  for notarization
# Without them the .exe is unsigned and the Mac app is ad-hoc signed.
on:
  push:
    branches: ["**"]
    paths: ["PDFMule.pyw", "RELEASE_NOTES.md", ".github/workflows/release.yml", "tools/**",
             "pdf_mule_logo.png", "pdf_mule_icon.png", "pdf_mule_icon.ico", "PDFMule.manifest"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Python packages built into the .exe / app (the .pyw installs them by itself on first start).
  # pymupdf4llm < 1 keeps out the 100 MB layout model of 2.x; the built-in converter is the fallback.
  BUILD_PACKAGES: >-
    pyinstaller pillow certifi "PyQt6>=6.6,<7" "PyMuPDF>=1.25,<2" pytesseract openpyxl python-pptx
    pdf2docx deep-translator pillow-heif "pymupdf4llm<1"
  EXCLUDES: >-
    --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtQml --exclude-module PyQt6.QtQuick
    --exclude-module PyQt6.QtMultimedia --exclude-module PyQt6.QtPdf --exclude-module PyQt6.Qt3DCore
    --exclude-module weasyprint --exclude-module tkinter --exclude-module matplotlib
    --exclude-module scipy --exclude-module pandas --exclude-module onnxruntime --exclude-module pymupdf_layout

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' PDFMule.pyw | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          on_main=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then on_main=true; fi
          if [ "$on_main" != true ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Branch $GITHUB_REF_NAME: test build of v$version, no release."
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || printf '%s' "$COMMIT_MESSAGE" | grep -qF '[rebuild]'; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"; echo "Rebuilding v$version."
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists, nothing to build."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "build=true" >> "$GITHUB_OUTPUT"; echo "Building release v$version."
          fi

  test:
    # First start of the .pyw on fresh Windows, macOS and Ubuntu machines: it installs PyQt6 & co
    # by itself, opens its main window and closes (smoke mode).
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup code only uses names defined before it
        run: python tools/check_order.py PDFMule.pyw
      - name: Window libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1 > /dev/null
      - name: First start installs everything and opens the window
        run: python tools/smoke.py python PDFMule.pyw

  programs:
    # The automatic installs of the external programs on fresh machines: Tesseract OCR (+ Greek),
    # Ghostscript and LibreOffice, then a Greek OCR, a PDF/A and a Word → PDF conversion.
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: "Windows, official installers", env_no_winget: "1", programs: ""}
          - {os: macos-latest, name: "Mac, Homebrew", programs: ""}
          - {os: macos-latest, name: "Mac without Homebrew (LibreOffice disk image)", env_no_brew: "1", programs: "libreoffice"}
          - {os: ubuntu-latest, name: "Linux, apt", programs: ""}
    name: programs (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      PDFMULE_NO_WINGET: ${{ matrix.env_no_winget }}
      PDFMULE_NO_BREW: ${{ matrix.env_no_brew }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Window libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 > /dev/null
      - name: Python packages
        run: python -m pip install "PyQt6>=6.6,<7" "PyMuPDF>=1.25,<2" pillow certifi pytesseract python-docx
      - name: PDF Mule installs the programs by itself and uses them
        shell: bash
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python tools/programs_test.py ${{ matrix.programs }}

  build:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: windows-x64.exe
          - os: ubuntu-22.04
            kind: linux-x64
          - os: macos-latest
            kind: macos-arm64.zip
          - os: macos-15-intel
            kind: macos-x64.zip
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    env:
      ASSET: PDFMule_v${{ needs.version.outputs.version }}-${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          eval pip install $BUILD_PACKAGES
          python tools/build_info.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "${ASSET%.exe}"
          --icon pdf_mule_icon.ico --manifest PDFMule.manifest --version-file win_version.txt
          --add-data "pdf_mule_logo.png;." --add-data "pdf_mule_icon.png;." --add-data "pdf_mule_icon.ico;."
          $EXCLUDES PDFMule.pyw

      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed --name "$ASSET"
          --add-data "pdf_mule_logo.png:." --add-data "pdf_mule_icon.png:." --add-data "pdf_mule_icon.ico:."
          $EXCLUDES PDFMule.pyw

      - name: Build the macOS app
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          FULL_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          VERSION="${FULL_VERSION%%-*}"   # the Mac wants numbers only (1.7.0 for 1.7.0-rc1)
          APP="dist/PDF Mule.app"
          pyinstaller --noconfirm --windowed --onedir --name "PDF Mule" \
            --osx-bundle-identifier gr.nikkpap.pdfmule \
            --icon pdf_mule_icon.png \
            --add-data "pdf_mule_logo.png:." --add-data "pdf_mule_icon.png:." --add-data "pdf_mule_icon.ico:." \
            $EXCLUDES PDFMule.pyw
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string © 2026 Nikolaos K. Paridis (aka nikkpap) · ALU DEV TEAM" "$PLIST" || true
          if [ -n "$MAC_CERT_P12" ]; then
            echo "Signing with Developer ID and notarizing"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            security create-keychain -p temp "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p temp "$KEYCHAIN"
            echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
            cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST_END'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          PLIST_END
            codesign --force --deep --options runtime --timestamp \
              --entitlements "$RUNNER_TEMP/entitlements.plist" --sign "$IDENTITY" "$APP"
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$APP"
            rm -f "$RUNNER_TEMP/cert.p12"
          else
            echo "::warning::No MACOS_CERT_P12 secret, so the Mac app is only ad-hoc signed (not notarized)."
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP" && echo "Signature OK"
          ditto -c -k --keepParent "$APP" "dist/$ASSET"

      - name: Sign the Windows .exe
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) {
            Write-Host "::warning::No WINDOWS_CERT_PFX secret, so the .exe is not signed."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:CERT_PFX -replace '\s', '')))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            /d "PDF Mule" /du "https://github.com/nikkpap/PDFMule" `
            "dist\$env:ASSET"
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($code) { exit $code }
          Get-AuthenticodeSignature "dist\$env:ASSET" | Format-List Status, StatusMessage, SignerCertificate

      - name: Smoke test the Windows .exe
        if: runner.os == 'Windows'
        shell: bash
        run: python tools/smoke.py "dist/$ASSET"

      - name: Smoke test the Linux binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1 > /dev/null
          python tools/smoke.py "dist/$ASSET"

      - name: Smoke test the macOS app
        if: runner.os == 'macOS'
        run: python tools/smoke.py --no-offscreen "dist/PDF Mule.app/Contents/MacOS/PDF Mule"

      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256";
          else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}*
          compression-level: 0

  release:
    needs: [version, test, programs, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the .pyw script
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp PDFMule.pyw "dist/PDFMule_v$VERSION.pyw"
          cp pdf_mule_logo.png pdf_mule_icon.png pdf_mule_icon.ico dist/
          cd dist
          sha256sum "PDFMule_v$VERSION.pyw" > "PDFMule_v$VERSION.pyw.sha256"
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac   # v1.7.0-rc1: a test version, not "Latest"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "PDF Mule $TAG" --notes-file RELEASE_NOTES.md $PRE
          gh release upload "$TAG" dist/* --clobber
